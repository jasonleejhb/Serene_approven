<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Approven Mobile - Login</title>
  
  <!-- Mobile Web App & Shortcut Icons -->
  <link rel="icon" type="image/png" href="/m/static/favicon.png?v={{ cache_buster }}">
  <link rel="apple-touch-icon" href="/m/static/apple-touch-icon.png?v={{ cache_buster }}">
  <link rel="apple-touch-icon" sizes="180x180" href="/m/static/apple-touch-icon.png?v={{ cache_buster }}">
  <link rel="manifest" href="/m/static/manifest.json?v={{ cache_buster }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Approven">
  <meta name="theme-color" content="#001429">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="stylesheet" href="/m/static/mobile.css?v={{ cache_buster }}">
</head>
<body class="mobile-login-body">
  <div class="mobile-login-wrapper">
    <div class="mobile-login-card">
      <div class="mobile-brand-section">
        <div class="mobile-logo-circle">
          <img src="/m/static/Logo Login Screen Homepage.jpg?v={{ cache_buster }}" alt="Approven Logo" class="mobile-login-logo">
        </div>
        <h1 class="mobile-app-name">Approven</h1>
        <div class="mobile-app-tag">Audit Management System</div>
        <span class="mobile-version-badge">Mobile Portal</span>
      </div>

      <div id="errorAlert" class="mobile-error-alert" style="display: none;"></div>

      <form id="mobileLoginForm" class="mobile-form" autocomplete="on">
        <div class="mobile-input-group">
          <label for="username" class="mobile-label">Username</label>
          <div class="mobile-input-box">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" name="username" class="mobile-input" placeholder="Enter username" required autofocus autocapitalize="none">
          </div>
        </div>

        <div class="mobile-input-group">
          <label for="password" class="mobile-label">Password</label>
          <div class="mobile-input-box">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" class="mobile-input" placeholder="Enter password" required>
            <button type="button" id="btnTogglePassword" class="btn-pwd-toggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btnSubmitLogin" class="mobile-btn-primary">
          <span id="loginBtnText">Sign In</span>
          <span id="loginSpinner" class="mobile-spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="mobile-login-footer">
        <span>Approven Live &bull; Encrypted &bull; ISO Compliance</span>
      </div>
    </div>
  </div>

  <script>
    // Enforce session clearing on login screen
    sessionStorage.removeItem('approven_authenticated');
    if (window.caches) {
      caches.keys().then(names => {
        names.forEach(name => caches.delete(name));
      }).catch(() => {});
    }

    const pwdInput = document.getElementById('password');
    const btnToggle = document.getElementById('btnTogglePassword');
    btnToggle.addEventListener('click', () => {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
    });

    document.getElementById('mobileLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alertBox = document.getElementById('errorAlert');
      const submitBtn = document.getElementById('btnSubmitLogin');
      const btnText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');
      
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'inline-block';

      const formData = new FormData(this);
      try {
        const response = await fetch('/m/api/login', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (response.ok && data.success) {
          sessionStorage.setItem('approven_authenticated', 'true');
          window.location.href = data.redirect || '/m';
        } else {
          alertBox.textContent = data.message || 'Invalid username or password.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          btnText.style.display = 'inline-block';
          spinner.style.display = 'none';
        }
      } catch (err) {
        alertBox.textContent = 'Unable to connect to server. Please try again.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        btnText.style.display = 'inline-block';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>

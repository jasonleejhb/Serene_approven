<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Approven - Login</title>
  <!-- Mobile Web App & Shortcut Icons -->
  <link rel="icon" type="image/png" href="/static/favicon.png?v={{ cache_buster }}">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ cache_buster }}">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{ cache_buster }}">
  <link rel="manifest" href="/static/manifest.json?v={{ cache_buster }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Approven">
  <meta name="theme-color" content="#001429">
  <link rel="stylesheet" href="/static/styles.css?v={{ cache_buster }}">
</head>
<body class="login-body">

  <div class="login-card">
    <img src="/static/Logo Login Screen Homepage.jpg?v={{ cache_buster }}" alt="Approven Logo" class="login-logo">
    <div class="login-subtitle">Audit Management System</div>

    <div id="errorAlert" class="error-alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-primary login-btn">Sign In</button>
    </form>
  </div>

  <script>
    // Clear any previous session authentication and caches on login page
    sessionStorage.removeItem('approven_authenticated');
    if (window.caches) {
      caches.keys().then(names => {
        names.forEach(name => caches.delete(name));
      }).catch(() => {});
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alertBox = document.getElementById('errorAlert');
      alertBox.style.display = 'none';

      const formData = new FormData(this);
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (response.ok && data.success) {
          sessionStorage.setItem('approven_authenticated', 'true');
          window.location.href = data.redirect || '/';
        } else {
          alertBox.textContent = data.message || 'Login failed. Please check credentials.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.textContent = 'Server connection error. Please try again.';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
